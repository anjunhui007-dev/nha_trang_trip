<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나트랑 여행 지도</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f6f8fb;color:#172333}header{background:#123b54;color:white;padding:15px 20px}h1{font-size:21px;margin:0}header small{opacity:.8}.layout{display:grid;grid-template-columns:350px 1fr;height:calc(100dvh - 74px)}aside{overflow:auto;padding:15px;background:white;border-right:1px solid #ddd}#map{height:100%;min-height:420px}.tabs,.filters{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}button{border:1px solid #ccd5dc;background:white;border-radius:8px;padding:8px;cursor:pointer}button.active{background:#145b79;color:white}.place{padding:10px;border-bottom:1px solid #eee}.place label{display:flex;gap:8px;align-items:center;font-weight:600}.place small{display:block;margin:4px 0 0 25px;color:#536270}.price{color:#137457}.muted{color:#697987;font-size:12px}.day{padding:12px;border-bottom:1px solid #e1e5e9}.hidden{display:none}input[type=search]{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:8px}a{color:#076d99}@media(max-width:700px){.layout{display:flex;flex-direction:column;height:auto}aside{order:2;max-height:none}#map{order:1;height:53dvh;min-height:330px}}</style></head><body><header><h1>🇻🇳 나트랑 확정 일정 지도</h1><small>2026.11.13–20 · 확정 일정 장소만 표시 · 체크해서 핀 표시</small></header><div class="layout"><aside><div class="tabs"><button id="placesTab" class="active">장소 선택</button><button id="planTab">기본 일정</button></div><section id="places"><input id="search" type="search" placeholder="장소 검색"><div class="filters" id="filters"></div><div class="muted" id="count"></div><div id="list"></div></section><section id="plan" class="hidden"></section></aside><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const raw=[
["나트랑 시내","기본","Nha Trang City",12.2388,109.1967,"11/13 도착·환전·야시장·저녁 / 11/18 시내 복귀",""],
["나트랑 야시장","기본","Nha Trang Night Market",12.237,109.196,"11/13 야시장 방문","무료 입장"],
["깜란 국제공항","기본","Cam Ranh International Airport",11.998,109.219,"11/13 입국 및 11/20 귀국",""],
["호핑투어 출항지 (미확정)","기본","Nha Trang Tourist Port",12.203,109.217,"11/14 스노클링·섬 호핑투어. 실제 집결지 확인 필요","예약 상품 확인"],
["빈원더스","기본","VinWonders Nha Trang",12.218,109.245,"11/15 종일 방문","예약 상품 확인"],
["혼땀섬 리조트","기본","Hon Tam Resort Nha Trang",12.173,109.231,"11/16~17 혼땀섬 숙박·해변·수영장","숙소 예약 확인"],
["혼땀 머드스파","기본","Hon Tam Mud Bath Nha Trang",12.176,109.229,"11/17 머드스파","포함 여부 확인"],
["판랑 선셋 지프투어 (장소 미확정)","기본","Phan Rang Thap Cham Vietnam",11.565,108.989,"11/18 판랑 투어. 실제 방문 사구와 집결지 확인 필요","예약 상품 확인"],
["아이리조트","기본","I Resort Nha Trang",12.278,109.172,"11/19 머드온천","예약 상품 확인"],
["롯데마트","기본","Lotte Mart Nha Trang",12.247,109.194,"11/19 쇼핑. 이용 지점 확인 필요","구매액에 따라"],
["세탁소 (미확정)","기본","Laundry Nha Trang",12.24,109.194,"11/19 세탁 맡기기. 실제 업체·수령 시각 확인 필요","업체 미정"],
["마사지 (업체 미확정)","기본","Massage Nha Trang",12.239,109.195,"11/14 및 11/19 마사지 예정. 업체 미정","업체 미정"]
];
const data=raw.map((r,i)=>({id:i,name:r[0],cat:r[1],query:r[2],lat:r[3],lng:r[4],desc:r[5],price:r[6]}));
const colors={"기본":"#e05836"};
let saved;try{saved=JSON.parse(localStorage.getItem("nha-selected"))}catch(e){}let selected=new Set(Array.isArray(saved)?saved.filter(id=>id>=0&&id<data.length):data.map(x=>x.id));let filter="전체",search="";
const map=L.map("map").setView([12.24,109.19],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
let pins=L.layerGroup().addTo(map);
function gm(x){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x.query)}
function renderPins(){pins.clearLayers();for(const x of data.filter(x=>selected.has(x.id))){const marker=L.circleMarker([x.lat,x.lng],{radius:9,color:"#fff",weight:2,fillColor:colors[x.cat],fillOpacity:.95}).addTo(pins);const box=document.createElement("div");box.innerHTML="<b>"+x.name+"</b><br>"+x.desc+"<br><b>"+x.price+"</b><br>";const a=document.createElement("a");a.href=gm(x);a.target="_blank";a.rel="noopener noreferrer";a.textContent="Google 지도에서 실제 위치 확인";box.append(a);marker.bindPopup(box)}}function save(){localStorage.setItem("nha-selected",JSON.stringify([...selected]));renderPins();renderList()}
function renderList(){const list=document.getElementById("list");list.replaceChildren();let shown=data.filter(x=>(filter==="전체"||x.cat===filter)&&(x.name+x.desc).toLowerCase().includes(search.toLowerCase()));document.getElementById("count").textContent="전체 "+data.length+"곳 · 현재 표시 "+selected.size+"곳 · 검색 결과 "+shown.length+"곳";for(const x of shown){const div=document.createElement("div");div.className="place";const label=document.createElement("label");const cb=document.createElement("input");cb.type="checkbox";cb.checked=selected.has(x.id);cb.onchange=()=>{cb.checked?selected.add(x.id):selected.delete(x.id);save()};label.append(cb,document.createTextNode(x.name));div.append(label);const detail=document.createElement("small");detail.textContent=x.cat+" · "+x.desc+(x.price?" · "+x.price:"");div.append(detail);const b=document.createElement("button");b.textContent="지도에서 보기";b.onclick=()=>{selected.add(x.id);save();map.setView([x.lat,x.lng],14);if(window.innerWidth<700)window.scrollTo({top:0,behavior:"smooth"})};div.append(b);const a=document.createElement("a");a.href=gm(x);a.target="_blank";a.rel="noopener noreferrer";a.textContent="  Google 지도 검색";div.append(a);list.append(div)}}
const filters=document.getElementById("filters");for(const f of ["전체",...Object.keys(colors)]){const b=document.createElement("button");b.textContent=f;b.onclick=()=>{filter=f;for(const child of filters.children)child.classList.toggle("active",child===b);renderList()};if(f==="전체")b.className="active";filters.append(b)}
document.getElementById("search").oninput=e=>{search=e.target.value;renderList()};
const days=[["11/13 금","나트랑 도착 → 시내 1번 숙소 → 야시장"],["11/14 토","호핑·스노클링 → 시내 복귀 → 마사지 → 저녁"],["11/15 일","빈원더스 09:00~19:30 (운영시간·공연 확인)"],["11/16 월","시내 체크아웃 → 혼땀섬 입도 → 리조트 휴양"],["11/17 화","혼땀 머드스파 → 물놀이·휴식"],["11/18 수","혼땀 체크아웃 → 시내 2번 숙소 → 판랑 선셋 투어"],["11/19 목","아이리조트 → 롯데마트 → 세탁소 → 마사지"],["11/20 금","귀국 · 항공편 시간 확인 필요"]];document.getElementById("plan").innerHTML=days.map(d=>'<div class="day"><b>'+d[0]+'</b><p>'+d[1]+'</p></div>').join("")+"<p class='muted'>기본 일정만 표시합니다. 숙소명·집결지·세탁소·마사지 업체 등 미확정 위치는 대표 위치로 표시했습니다.</p>";
document.getElementById("placesTab").onclick=()=>{document.getElementById("places").classList.remove("hidden");document.getElementById("plan").classList.add("hidden");document.getElementById("placesTab").classList.add("active");document.getElementById("planTab").classList.remove("active")};
document.getElementById("planTab").onclick=()=>{document.getElementById("places").classList.add("hidden");document.getElementById("plan").classList.remove("hidden");document.getElementById("planTab").classList.add("active");document.getElementById("placesTab").classList.remove("active")};
renderPins();renderList();</script></body></html>
