<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나트랑 여행 지도</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f6f8fb;color:#172333}header{background:#123b54;color:white;padding:15px 20px}h1{font-size:21px;margin:0}header small{opacity:.8}.layout{display:grid;grid-template-columns:minmax(420px, 1.65fr) minmax(280px, 1fr);height:calc(100dvh - 74px)}aside{overflow:auto;padding:20px;background:white;border-right:1px solid #ddd}#mapArea{height:100%;min-height:300px;display:flex;flex-direction:column}#map{flex:1;min-height:250px}.tabs,.filters{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}button{border:1px solid #ccd5dc;background:white;border-radius:8px;padding:8px;cursor:pointer}button.active{background:#145b79;color:white}.place{padding:10px;border-bottom:1px solid #eee}.place label{display:flex;gap:8px;align-items:center;font-weight:600}.place small{display:block;margin:4px 0 0 25px;color:#536270}.price{color:#137457}.muted{color:#697987;font-size:12px}.day{padding:12px;border-bottom:1px solid #e1e5e9}.hidden{display:none}input[type=search]{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:8px}a{color:#076d99}@media(max-width:700px){.layout{display:flex;flex-direction:column;height:auto}aside{order:2;max-height:none}#mapArea{order:1;height:38dvh;min-height:255px}#map{min-height:170px}} .day.past{background:#f0f1f3;color:#90969c}.day.past .muted{color:#9ca2a8}.day.today{background:#fff5dc;border-left:5px solid #e7a820;color:#283344}.day.today>b{color:#9b5b00}.day.future{background:white}.editor-card{border:1px solid #dce5eb;border-radius:12px;padding:12px;margin:10px 0;background:#fff}.editor-card input,.editor-card textarea,.editor-card select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #cbd5dc;border-radius:7px;font:inherit;margin:4px 0}.editor-card textarea{min-height:56px}.editor-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.editor-toolbar button{background:#eaf3f8}.editor-card .remove{color:#b23c3c}.editor-help{font-size:12px;color:#687887;line-height:1.5}.editor-card .field-label{font-size:12px;color:#566676;font-weight:600}.editor-card .two{display:grid;grid-template-columns:95px 1fr;gap:8px}.editor-card .move{display:flex;gap:6px;margin-top:8px}.editor-card .move button{font-size:12px}.my-item{padding:10px 0;border-bottom:1px solid #e8edf1}.my-item:last-child{border-bottom:0}.my-item-title{font-weight:650}.my-item-time{display:inline-block;min-width:46px;color:#126184;font-weight:700;font-size:13px}.my-note{white-space:pre-wrap;overflow-wrap:anywhere;color:#526272;font-size:13px;margin:5px 0 0 48px}.my-day-count{font-size:12px;color:#687887;margin-top:4px}.my-empty{color:#81909a;font-size:13px;padding:8px 0}</style></head><body><header><h1>🇻🇳 나트랑 확정 일정 지도</h1><small>2026.11.13–20 · 확인된 위치만 표시 · 장소별 메모</small></header><div class="layout"><aside><div class="tabs"><button id="placesTab" class="active">장소 메모·선택</button><button id="planTab">기본 일정</button><button id="editTab">내 여행 계획</button><button id="viewTab">내 일정 보기</button></div><section id="places"><input id="search" type="search" placeholder="장소 검색"><div class="filters" id="filters"></div><div class="muted" id="count"></div><div id="list"></div></section><section id="plan" class="hidden"></section><section id="editor" class="hidden"></section><section id="mySchedule" class="hidden"></section></aside><div id="mapArea"><div id="map"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const raw=[
["나트랑 시내","기본","Nha Trang City",12.2388,109.1967,"11/13 도착·환전·시내 숙박",""],
["나트랑 야시장","기본","Nha Trang Night Market",12.237,109.196,"11/13 야시장",""],
["깜란 국제공항","기본","Cam Ranh International Airport",11.998,109.219,"11/13 입국 · 11/20 귀국",""],
["빈원더스","기본","VinWonders Nha Trang",12.218,109.245,"11/15 테마파크",""],
["혼땀섬 리조트","기본","Hon Tam Resort Nha Trang",12.173,109.231,"11/16~17 혼땀섬 숙박",""],
["혼땀 머드스파","기본","Hon Tam Mud Bath Nha Trang",12.176,109.229,"11/17 머드스파",""],
["아이리조트","기본","I Resort Nha Trang",12.278,109.172,"11/19 머드온천",""],
["롯데마트 골드코스트","기본","Lotte Mart Gold Coast Nha Trang",12.247,109.194,"11/19 쇼핑 (지점 확인 필요)",""]
];
const data=raw.map((r,i)=>({id:i,name:r[0],cat:r[1],query:r[2],lat:r[3],lng:r[4],desc:r[5],price:r[6]}));
const colors={"기본":"#e05836"};
let saved;try{saved=JSON.parse(localStorage.getItem("nha-selected"))}catch(e){}let selected=new Set(Array.isArray(saved)?saved.filter(id=>id>=0&&id<data.length):data.map(x=>x.id));let filter="전체",search="";
const map=L.map("map").setView([12.24,109.19],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
let pins=L.layerGroup().addTo(map);
function gm(x){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x.query)}
function renderPins(){pins.clearLayers();for(const x of data.filter(x=>selected.has(x.id))){const marker=L.circleMarker([x.lat,x.lng],{radius:9,color:"#fff",weight:2,fillColor:colors[x.cat],fillOpacity:.95}).addTo(pins);const box=document.createElement("div");box.innerHTML="<b>"+x.name+"</b><br>"+x.desc+"<br><b>"+x.price+"</b><br>";const a=document.createElement("a");a.href=gm(x);a.target="_blank";a.rel="noopener noreferrer";a.textContent="Google 지도에서 실제 위치 확인";box.append(a);marker.bindPopup(box)}}function save(){localStorage.setItem("nha-selected",JSON.stringify([...selected]));renderPins();renderList()}
function renderList(){const list=document.getElementById("list");list.replaceChildren();let shown=data.filter(x=>(filter==="전체"||x.cat===filter)&&(x.name+x.desc).toLowerCase().includes(search.toLowerCase()));document.getElementById("count").textContent="확정된 위치 "+data.length+"곳 · 현재 표시 "+selected.size+"곳 · 검색 결과 "+shown.length+"곳";for(const x of shown){const div=document.createElement("div");div.className="place";const label=document.createElement("label");const cb=document.createElement("input");cb.type="checkbox";cb.checked=selected.has(x.id);cb.onchange=()=>{cb.checked?selected.add(x.id):selected.delete(x.id);save()};label.append(cb,document.createTextNode(x.name));div.append(label);const detail=document.createElement("small");detail.textContent=x.cat+" · "+x.desc+(x.price?" · "+x.price:"");div.append(detail);const note=document.createElement("textarea");note.placeholder="이 장소에 대한 메모 (현재는 이 기기에 저장)";note.rows=2;note.style.cssText="box-sizing:border-box;width:100%;margin:8px 0;padding:8px;border:1px solid #ccd5dc;border-radius:7px";note.value=localStorage.getItem("nha-note-"+x.name)||"";note.oninput=()=>{localStorage.setItem("nha-note-"+x.name,note.value);status.textContent="이 기기에 저장됨 · 다른 기기 동기화는 미연결"};div.append(note);const status=document.createElement("div");status.className="muted";status.textContent="이 기기에 자동 저장";div.append(status);const b=document.createElement("button");b.textContent="지도에서 보기";b.onclick=()=>{selected.add(x.id);save();map.setView([x.lat,x.lng],14);if(window.innerWidth<700)window.scrollTo({top:0,behavior:"smooth"})};div.append(b);const a=document.createElement("a");a.href=gm(x);a.target="_blank";a.rel="noopener noreferrer";a.textContent="  Google 지도 검색";div.append(a);list.append(div)}}
const filters=document.getElementById("filters");for(const f of ["전체",...Object.keys(colors)]){const b=document.createElement("button");b.textContent=f;b.onclick=()=>{filter=f;for(const child of filters.children)child.classList.toggle("active",child===b);renderList()};if(f==="전체")b.className="active";filters.append(b)}
document.getElementById("search").oninput=e=>{search=e.target.value;renderList()};
const days=[["11/13 금","나트랑 도착 → 시내 1번 숙소 → 야시장"],["11/14 토","호핑·스노클링 → 시내 복귀 → 마사지 → 저녁"],["11/15 일","빈원더스 09:00~19:30 (운영시간·공연 확인)"],["11/16 월","시내 체크아웃 → 혼땀섬 입도 → 리조트 휴양"],["11/17 화","혼땀 머드스파 → 물놀이·휴식"],["11/18 수","혼땀 체크아웃 → 시내 2번 숙소 → 판랑 선셋 투어"],["11/19 목","아이리조트 → 롯데마트 → 세탁소 → 마사지"],["11/20 금","귀국 · 항공편 시간 확인 필요"]];const transfers=[
[{route:"깜란공항 → 나트랑 시내 숙소",options:[["그랩·택시","약 40~60분","약 300,000~500,000동 / 차량 1대·2인 합계"],["공항버스 + 도보·짧은 택시","약 60~90분","약 130,000~200,000동 / 2인 합계 + 추가 이동"]]}, {route:"시내 숙소 → 야시장",options:[["도보","약 5~25분","무료"],["그랩·택시","약 5~15분","약 30,000~60,000동 / 차량 1대·2인 합계"]]}],
[{route:"시내 숙소 → 호핑투어 집결지",options:[["투어 픽업 차량 (포함 시)","약 15~35분","포함 시 추가 0동"],["그랩·택시","약 15~35분","약 70,000~150,000동 / 차량 1대·2인 합계"]]}, {route:"투어 종료 → 시내 마사지·저녁",options:[["투어 복귀 차량 (포함 시)","약 15~35분","포함 시 추가 0동"],["그랩·택시","약 15~35분","약 70,000~150,000동 / 차량 1대·2인 합계"]]}],
[{route:"시내 숙소 → 빈원더스 케이블카 승강장",options:[["그랩·택시","약 15~30분","약 100,000~150,000동 / 차량 1대·2인 합계"],["그랩 바이크","약 15~30분","약 100,000~140,000동 / 2인 합계"]]}, {route:"케이블카 승강장 → 빈원더스",options:[["케이블카","탑승 약 8~15분 (대기 별도)","빈원더스 입장권에 포함"],["대체 쾌속정 (케이블카 중단 시)","약 7~10분 (대기 별도)","운영사 제공 시 포함"]]}],
[{route:"시내 숙소 → 혼땀섬 전용 선착장",options:[["리조트 픽업 (제공 시)","약 15~30분","포함 여부 확인"],["그랩·택시","약 15~30분","약 80,000~150,000동 / 차량 1대·2인 합계"]]}, {route:"혼땀 선착장 → 혼땀 리조트",options:[["리조트 연계 쾌속정","승선 약 7~10분 (대기 별도)","숙박 예약 포함 여부 확인"]]}],
[{route:"혼땀 리조트 → 머드스파",options:[["리조트 내부 이동·셔틀","약 5~20분","셔틀 무료 여부 확인"],["도보 (현장 동선 가능 시)","약 10~25분","무료"]]}],
[{route:"혼땀 리조트 → 본토 선착장",options:[["리조트 연계 쾌속정","승선 약 7~10분 (대기 별도)","숙박 예약 포함 여부 확인"]]}, {route:"본토 선착장 → 시내 2번 숙소",options:[["그랩·택시","약 15~30분","약 80,000~150,000동 / 차량 1대·2인 합계"]]}, {route:"시내 숙소 → 판랑 선셋 투어",options:[["예약 투어 차량 (픽업 포함 시)","편도 약 1.5~3시간 (투어 코스별 차이)","투어 요금에 포함 시 추가 0동"],["별도 전용차 (픽업 불포함 시)","편도 약 1.5~3시간","별도 견적 필요"]]}],
[{route:"시내 숙소 → 아이리조트",options:[["그랩·택시","약 15~30분","약 80,000~150,000동 / 차량 1대·2인 합계"],["그랩 바이크","약 15~30분","약 70,000~140,000동 / 2인 합계"]]}, {route:"아이리조트 → 롯데마트",options:[["그랩·택시","약 15~30분","약 70,000~130,000동 / 차량 1대·2인 합계"]]}, {route:"롯데마트 → 세탁소·마사지·숙소",options:[["도보 (시내 근거리 업체 선택 시)","구간별 약 5~20분","무료"],["그랩·택시","구간별 약 5~20분","구간별 약 30,000~70,000동 / 2인 합계"]]}],
[{route:"나트랑 시내 숙소 → 깜란공항",options:[["그랩·택시","약 40~60분","약 300,000~500,000동 / 차량 1대·2인 합계"],["공항버스","약 60~90분","약 130,000~200,000동 / 2인 합계 + 정류장 이동"]]}]
];
const plan=document.getElementById("plan");
function vnToday(){const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return p.year+"-"+p.month+"-"+p.day}
function renderSchedule(){const today=vnToday();plan.replaceChildren();const heading=document.createElement("p");heading.className="muted";heading.textContent="베트남 현지 날짜: "+today+" (UTC+7) · 오늘 일정 강조 / 지난 일정 회색";plan.append(heading);
days.forEach((d,i)=>{const date="2026-11-"+String(i+13).padStart(2,"0");const state=date<today?"past":date===today?"today":"future";const div=document.createElement("div");div.className="day "+state;const h=document.createElement("b");h.textContent=d[0]+(state==="today"?"  ● 오늘":state==="past"?"  ✓ 지난 일정":"");div.append(h);const p=document.createElement("p");p.textContent=d[1];div.append(p);const title=document.createElement("div");title.style.cssText="font-weight:700;font-size:13px;margin:12px 0 5px";title.textContent="추천 이동 동선";div.append(title);
transfers[i].forEach(t=>{const block=document.createElement("div");block.style.cssText="border-left:3px solid #b8cbd6;padding:5px 0 7px 10px;margin:7px 0";const route=document.createElement("strong");route.style.fontSize="13px";route.textContent=t.route;block.append(route);t.options.slice(0,2).forEach((o,k)=>{const line=document.createElement("div");line.style.cssText="font-size:12px;margin-top:4px;line-height:1.5";line.textContent=(k+1)+". "+o[0]+" · "+o[1]+" · "+o[2];block.append(line)});div.append(block)});plan.append(div)});
const foot=document.createElement("p");foot.className="muted";foot.textContent="※ 모든 가격은 2인 여행 기준(차량 1대 또는 2인분)입니다. 포함 여부 확인 항목은 예약 상품에 따라 달라집니다. 예상 시간·가격은 실시간 견적이 아닌 참고 범위입니다. 교통·날씨·정확한 숙소·집결지에 따라 달라집니다. 아래 일정표의 개별 요금은 기존 표기 단위가 섞여 있으므로, 지도에서 날짜를 선택하고 경로를 누르면 2인 합계 기준으로 확인할 수 있습니다. 왕복 이동은 별도 표기가 없으면 각 편도 요금입니다.";plan.append(foot)}
renderSchedule();
document.getElementById("placesTab").onclick=()=>{document.getElementById("places").classList.remove("hidden");document.getElementById("plan").classList.add("hidden");document.getElementById("placesTab").classList.add("active");document.getElementById("planTab").classList.remove("active")};
document.getElementById("planTab").onclick=()=>{renderSchedule();document.getElementById("places").classList.add("hidden");document.getElementById("plan").classList.remove("hidden");document.getElementById("planTab").classList.add("active");document.getElementById("placesTab").classList.remove("active")};
renderPins();renderList();
const editor=document.getElementById("editor");
const defaultItems=[

[{time:"",title:"호핑·스노클링 투어",place:null},{time:"",title:"마사지",place:null},{time:"",title:"현지 저녁",place:null}],
[{time:"09:00",title:"빈원더스",place:3}],
[{time:"",title:"시내 숙소 체크아웃",place:0},{time:"",title:"혼땀섬 리조트 이동·체크인",place:4},{time:"",title:"해변·수영장",place:4}],
[{time:"",title:"혼땀 머드스파",place:5},{time:"",title:"스노클링·수영·휴식",place:4}],
[{time:"",title:"혼땀 체크아웃·시내 복귀",place:4},{time:"",title:"시내 숙소 체크인",place:0},{time:"",title:"판랑 선셋 지프투어",place:null}],
[{time:"",title:"아이리조트 머드온천",place:6},{time:"",title:"롯데마트 쇼핑",place:7},{time:"",title:"세탁소",place:null},{time:"",title:"마사지",place:null}],
[{time:"",title:"시내 숙소 체크아웃",place:0},{time:"",title:"깜란공항·귀국",place:2}]
];
function freshPlan(){return defaultItems.map(day=>day.map(item=>({...item,note:""})))}
function loadPlan(){try{const v=JSON.parse(localStorage.getItem("nha-planner-v1"));if(Array.isArray(v)&&v.length===8&&v.every(Array.isArray))return v}catch(e){}return freshPlan()}
let userPlan=loadPlan(),editDay=0;
function savePlan(){localStorage.setItem("nha-planner-v1",JSON.stringify(userPlan));const st=document.getElementById("editorStatus");if(st)st.textContent="이 기기에 저장됨 · "+new Date().toLocaleTimeString("ko-KR")}
function chooseDay(n){editDay=n;renderEditor()}
function renderEditor(){editor.replaceChildren();const h=document.createElement("h2");h.textContent="내 여행 계획";h.style.margin="8px 0";editor.append(h);const help=document.createElement("p");help.className="editor-help";help.textContent="원본 기본 일정은 변경되지 않습니다. 날짜별 방문 순서·시간·메모를 수정하세요.";editor.append(help);
const daysBar=document.createElement("div");daysBar.className="filters";for(let i=0;i<8;i++){const b=document.createElement("button");b.textContent="11/"+(13+i);b.className=i===editDay?"active":"";b.onclick=()=>chooseDay(i);daysBar.append(b)}editor.append(daysBar);
const toolbar=document.createElement("div");toolbar.className="editor-toolbar";
const add=document.createElement("button");add.textContent="+ 일정 추가";add.onclick=()=>{userPlan[editDay].push({time:"",title:"새 일정",place:null,note:""});savePlan();renderEditor()};toolbar.append(add);
const reset=document.createElement("button");reset.textContent="이 날짜 원본으로 복원";reset.onclick=()=>{if(confirm("이 날짜에 작성한 수정 내용이 삭제됩니다. 계속할까요?")){userPlan[editDay]=freshPlan()[editDay];savePlan();renderEditor()}};toolbar.append(reset);
editor.append(toolbar);
userPlan[editDay].forEach((item,i)=>{const card=document.createElement("div");card.className="editor-card";const top=document.createElement("div");top.className="two";const time=document.createElement("input");time.type="time";time.value=item.time||"";time.onchange=()=>{item.time=time.value;savePlan()};const title=document.createElement("input");title.value=item.title||"";title.placeholder="일정 이름";title.oninput=()=>{item.title=title.value;savePlan()};top.append(time,title);card.append(top);
const note=document.createElement("textarea");note.placeholder="예약정보, 준비물, 예산, 체크할 내용 등을 자유롭게 메모";note.value=item.note||"";note.oninput=()=>{item.note=note.value;savePlan()};card.append(note);
const actions=document.createElement("div");actions.className="move";const up=document.createElement("button");up.textContent="↑ 위로";up.disabled=i===0;up.onclick=()=>{[userPlan[editDay][i-1],userPlan[editDay][i]]=[userPlan[editDay][i],userPlan[editDay][i-1]];savePlan();renderEditor()};actions.append(up);const down=document.createElement("button");down.textContent="↓ 아래로";down.disabled=i===userPlan[editDay].length-1;down.onclick=()=>{[userPlan[editDay][i+1],userPlan[editDay][i]]=[userPlan[editDay][i],userPlan[editDay][i+1]];savePlan();renderEditor()};actions.append(down);const del=document.createElement("button");del.className="remove";del.textContent="삭제";del.onclick=()=>{userPlan[editDay].splice(i,1);savePlan();renderEditor()};actions.append(del);card.append(actions);editor.append(card)});
const foot=document.createElement("div");foot.className="editor-toolbar";const exportBtn=document.createElement("button");exportBtn.textContent="↓ 계획 백업(JSON)";exportBtn.onclick=()=>{const notes={};data.forEach(p=>{const v=localStorage.getItem("nha-note-"+p.name);if(v!==null)notes[p.name]=v});const blob=new Blob([JSON.stringify({version:1,trip:"nha-trang-2026",plan:userPlan,notes},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="nha-trang-plan-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};foot.append(exportBtn);
const importLabel=document.createElement("label");importLabel.style.cssText="padding:8px;border:1px solid #ccd5dc;border-radius:8px;cursor:pointer";importLabel.textContent="↑ 백업 불러오기";const file=document.createElement("input");file.type="file";file.accept=".json,application/json";file.style.display="none";file.onchange=async()=>{if(!file.files[0])return;try{const obj=JSON.parse(await file.files[0].text());if(obj.trip!=="nha-trang-2026"||!Array.isArray(obj.plan)||obj.plan.length!==8||!obj.plan.every(Array.isArray))throw Error("지원하지 않는 백업 파일입니다");if(!confirm("현재 내 여행 계획을 백업 내용으로 덮어쓸까요?"))return;userPlan=obj.plan.map(day=>day.map(x=>({time:String(x.time||""),title:String(x.title||""),place:Number.isInteger(x.place)&&x.place>=0&&x.place<data.length?x.place:null,note:String(x.note||"")})));if(obj.notes&&typeof obj.notes==="object")data.forEach(p=>{if(typeof obj.notes[p.name]==="string")localStorage.setItem("nha-note-"+p.name,obj.notes[p.name])});savePlan();renderEditor();renderList()}catch(e){alert("불러오기 실패: "+e.message)}};importLabel.append(file);foot.append(importLabel);editor.append(foot);
const status=document.createElement("p");status.id="editorStatus";status.className="editor-help";status.textContent="자동 저장: 이 브라우저 · 다른 기기는 백업 파일로 이동 · 서버 동기화 미연결";editor.append(status)}
document.getElementById("editTab").onclick=()=>{document.getElementById("places").classList.add("hidden");document.getElementById("plan").classList.add("hidden");editor.classList.remove("hidden");for(const id of ["placesTab","planTab","editTab"])document.getElementById(id).classList.toggle("active",id==="editTab");renderEditor()};
const oldPlacesClick=document.getElementById("placesTab").onclick;document.getElementById("placesTab").onclick=()=>{editor.classList.add("hidden");document.getElementById("editTab").classList.remove("active");oldPlacesClick()};
const oldPlanClick=document.getElementById("planTab").onclick;document.getElementById("planTab").onclick=()=>{editor.classList.add("hidden");document.getElementById("editTab").classList.remove("active");oldPlanClick()};
renderEditor();

function renderMySchedule(){const view=document.getElementById("mySchedule");view.replaceChildren();const h=document.createElement("h2");h.textContent="내 일정 보기";h.style.margin="8px 0";view.append(h);const intro=document.createElement("p");intro.className="editor-help";intro.textContent="내 여행 계획에서 작성한 일정과 메모를 날짜별로 모아 보여줍니다. 수정 사항은 이 탭을 열 때 바로 반영됩니다.";view.append(intro);
const edit=document.createElement("button");edit.textContent="✎ 내 여행 계획 편집";edit.style.marginBottom="12px";edit.onclick=()=>document.getElementById("editTab").click();view.append(edit);
const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const weekdays=["금","토","일","월","화","수","목","금"];
userPlan.forEach((items,i)=>{const date="2026-11-"+String(13+i).padStart(2,"0");const day=document.createElement("div");day.className="day "+(date<today?"past":date===today?"today":"future");const heading=document.createElement("b");heading.textContent="11/"+(13+i)+" ("+weekdays[i]+")";day.append(heading);const count=document.createElement("div");count.className="my-day-count";count.textContent=items.length+"개 일정";day.append(count);
if(!items.length){const empty=document.createElement("p");empty.className="my-empty";empty.textContent="작성된 일정이 없습니다.";day.append(empty)}
items.forEach((item,j)=>{const card=document.createElement("div");card.className="my-item";const line=document.createElement("div");const time=document.createElement("span");time.className="my-item-time";time.textContent=item.time||String(j+1).padStart(2,"0")+".";const name=document.createElement("span");name.className="my-item-title";name.textContent=item.title||"제목 없는 일정";line.append(time,name);card.append(line);if(item.note&&item.note.trim()){const note=document.createElement("div");note.className="my-note";note.textContent=item.note;card.append(note)}day.append(card)});view.append(day)})}
document.getElementById("viewTab").onclick=()=>{for(const id of ["places","plan","editor","mySchedule"])document.getElementById(id).classList.toggle("hidden",id!=="mySchedule");for(const id of ["placesTab","planTab","editTab","viewTab"])document.getElementById(id).classList.toggle("active",id==="viewTab");renderMySchedule()};
for(const id of ["placesTab","planTab","editTab"]){const old=document.getElementById(id).onclick;document.getElementById(id).onclick=()=>{document.getElementById("mySchedule").classList.add("hidden");document.getElementById("viewTab").classList.remove("active");old()}} 
</script></body></html>
