const TRIP_API="https://gjntjxzklbljxjuceuus.supabase.co/rest/v1/shared_trip_state";
const TRIP_KEY="sb_publishable_ZfHAOGrMIEnANBb41SUg-A_gB36RYcX";
const TRIP_HEADERS={"apikey":TRIP_KEY,"Authorization":"Bearer "+TRIP_KEY,"Content-Type":"application/json"};
let tripReady=false,tripRevision="",tripSaving=false,tripPending=false,tripTimer=null;
function tripNotes(){const notes={};data.forEach(p=>{const v=localStorage.getItem("nha-note-"+p.name);if(v!==null)notes[p.name]=v});return notes}
function tripFoodNotes(){const notes={};dayFood.forEach(group=>group[1].forEach(([name])=>{const v=localStorage.getItem("nha-food-note-"+name);if(v!==null)notes[name]=v}));return notes}
function tripStatus(message){const st=document.getElementById("editorStatus");if(st)st.textContent=message}
async function tripRequest(method,body){const res=await fetch(TRIP_API+"?id=eq.nha-trang-2026"+(method==="GET"?"&select=*":""),{method,headers:{...TRIP_HEADERS,...(method!=="GET"?{"Prefer":"return=representation"}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!res.ok)throw Error("서버 "+res.status+": "+(await res.text()).slice(0,160));return res.json()}
function applyTrip(row){if(!Array.isArray(row.plan)||row.plan.length!==8)return;userPlan=row.plan;localStorage.setItem("nha-planner-v1",JSON.stringify(userPlan));for(const [key,value] of Object.entries(row.notes||{}))localStorage.setItem("nha-note-"+key,String(value));for(const [key,value] of Object.entries(row.food_notes||{}))localStorage.setItem("nha-food-note-"+key,String(value));tripRevision=row.updated_at;renderEditor();renderList();if(!document.getElementById("mySchedule").classList.contains("hidden"))renderMySchedule()}
async function initTrip(){try{let rows=await tripRequest("GET");if(!rows.length){const body={id:"nha-trang-2026",plan:userPlan,notes:tripNotes(),food_notes:tripFoodNotes()};try{rows=await tripRequest("POST",body)}catch(e){rows=await tripRequest("GET");if(!rows.length)throw e}}if(rows[0])applyTrip(rows[0]);tripReady=true;tripStatus("서버 연결됨 · 자동 동기화");setInterval(refreshTrip,5000)}catch(e){tripStatus("서버 연결 실패 · 로컬 저장 중: "+e.message)}}
async function refreshTrip(){if(!tripReady||tripSaving||tripPending||document.activeElement?.matches("input,textarea,select"))return;try{const rows=await tripRequest("GET");if(rows[0]&&rows[0].updated_at!==tripRevision){applyTrip(rows[0]);tripStatus("다른 기기의 변경사항 동기화됨")}}catch(e){tripStatus("서버 연결 확인 중 · "+e.message)}}
function queueTripSave(){if(!tripReady)return;tripPending=true;clearTimeout(tripTimer);tripTimer=setTimeout(flushTrip,700)}
async function flushTrip(){if(tripSaving||!tripPending)return;tripPending=false;tripSaving=true;try{const rows=await tripRequest("PATCH",{plan:userPlan,notes:tripNotes(),food_notes:tripFoodNotes(),updated_at:new Date().toISOString()});if(rows[0])tripRevision=rows[0].updated_at;tripStatus("서버 저장 완료 · "+new Date().toLocaleTimeString("ko-KR"))}catch(e){tripPending=true;tripStatus("서버 저장 실패 · 재시도 필요: "+e.message)}finally{tripSaving=false;if(tripPending){clearTimeout(tripTimer);tripTimer=setTimeout(flushTrip,1500)}}}

function chooseDay(n){editDay=n;renderEditor()}
function renderEditor(){editor.replaceChildren();const openView=document.createElement("button");openView.textContent="📋 작성한 여행계획 보기";openView.style.cssText="width:100%;background:#145b79;color:#fff;font-weight:700;margin-bottom:10px";openView.onclick=()=>document.getElementById("viewTab").click();editor.append(openView);const h=document.createElement("h2");h.textContent="내 여행 계획";h.style.margin="8px 0";editor.append(h);const help=document.createElement("p");help.className="editor-help";help.textContent="원본 기본 일정은 변경되지 않습니다. 날짜별 방문 순서·시간·메모를 수정하세요.";editor.append(help);

const seen=new Set();dayFood.forEach((group,di)=>{const optgroup=document.createElement("optgroup");optgroup.label=group[0];group[1].forEach(([name,type,address])=>{const key=name+"|"+address;if(seen.has(key))return;seen.add(key);const option=document.createElement("option");option.value=key;option.textContent=name+" · "+type;optgroup.append(option)});if(optgroup.children.length)foodSelect.append(optgroup)});

const confirmFood=document.createElement("button");confirmFood.type="button";confirmFood.textContent="선택한 식당 추가";confirmFood.onclick=()=>{if(!foodSelect.value){foodSelect.focus();return}const [name,address]=foodSelect.value.split("|");const restaurant=dayFood.flatMap(group=>group[1]).find(x=>x[0]===name&&x[2]===address);if(!restaurant)return;const savedNote=localStorage.getItem("nha-food-note-"+name)||"";userPlan[editDay].push({time:"",title:name,place:null,note:(address+", Nha Trang, Vietnam")+(savedNote?"\\n"+savedNote:"")});savePlan();renderEditor()};foodPicker.append(confirmFood);

const reset=document.createElement("button");reset.textContent="이 날짜 원본으로 복원";reset.onclick=()=>{if(confirm("이 날짜에 작성한 수정 내용이 삭제됩니다. 계속할까요?")){userPlan[editDay]=freshPlan()[editDay];savePlan();renderEditor()}};toolbar.append(reset);
editor.append(toolbar);editor.append(foodPicker);
userPlan[editDay].forEach((item,i)=>{const card=document.createElement("div");card.className="editor-card";const top=document.createElement("div");top.className="two";const time=document.createElement("input");time.type="time";time.value=item.time||"";time.onchange=()=>{item.time=time.value;savePlan()};const title=document.createElement("input");title.value=item.title||"";title.placeholder="일정 이름";title.oninput=()=>{item.title=title.value;savePlan()};top.append(time,title);card.append(top);
const note=document.createElement("textarea");note.placeholder="예약정보, 준비물, 예산, 체크할 내용 등을 자유롭게 메모";note.value=item.note||"";note.oninput=()=>{item.note=note.value;savePlan()};card.append(note);
const actions=document.createElement("div");actions.className="move";const up=document.createElement("button");up.textContent="↑ 위로";up.disabled=i===0;up.onclick=()=>{[userPlan[editDay][i-1],userPlan[editDay][i]]=[userPlan[editDay][i],userPlan[editDay][i-1]];savePlan();renderEditor()};actions.append(up);const down=document.createElement("button");down.textContent="↓ 아래로";down.disabled=i===userPlan[editDay].length-1;down.onclick=()=>{[userPlan[editDay][i+1],userPlan[editDay][i]]=[userPlan[editDay][i],userPlan[editDay][i+1]];savePlan();renderEditor()};actions.append(down);const del=document.createElement("button");del.className="remove";del.textContent="삭제";del.onclick=()=>{userPlan[editDay].splice(i,1);savePlan();renderEditor()};actions.append(del);card.append(actions);editor.append(card)});
const foot=document.createElement("div");foot.className="editor-toolbar";const exportBtn=document.createElement("button");exportBtn.textContent="↓ 계획 백업(JSON)";exportBtn.onclick=()=>{const notes={};data.forEach(p=>{const v=localStorage.getItem("nha-note-"+p.name);if(v!==null)notes[p.name]=v});const foodNotes={};restaurants.forEach(r=>{const v=localStorage.getItem("nha-food-note-"+r[0]);if(v!==null)foodNotes[r[0]]=v});const blob=new Blob([JSON.stringify({version:1,trip:"nha-trang-2026",plan:userPlan,notes,foodNotes},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="nha-trang-plan-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};foot.append(exportBtn);
const importLabel=document.createElement("label");importLabel.style.cssText="padding:8px;border:1px solid #ccd5dc;border-radius:8px;cursor:pointer";importLabel.textContent="↑ 백업 불러오기";const file=document.createElement("input");file.type="file";file.accept=".json,application/json";file.style.display="none";file.onchange=async()=>{if(!file.files[0])return;try{const obj=JSON.parse(await file.files[0].text());if(obj.trip!=="nha-trang-2026"||!Array.isArray(obj.plan)||obj.plan.length!==8||!obj.plan.every(Array.isArray))throw Error("지원하지 않는 백업 파일입니다");if(!confirm("현재 내 여행 계획을 백업 내용으로 덮어쓸까요?"))return;userPlan=obj.plan.map(day=>day.map(x=>({time:String(x.time||""),title:String(x.title||""),place:Number.isInteger(x.place)&&x.place>=0&&x.place<data.length?x.place:null,note:String(x.note||"")})));if(obj.notes&&typeof obj.notes==="object")data.forEach(p=>{if(typeof obj.notes[p.name]==="string")localStorage.setItem("nha-note-"+p.name,obj.notes[p.name])});if(obj.foodNotes&&typeof obj.foodNotes==="object")restaurants.forEach(r=>{if(typeof obj.foodNotes[r[0]]==="string")localStorage.setItem("nha-food-note-"+r[0],obj.foodNotes[r[0]])});savePlan();renderEditor();renderList()}catch(e){alert("불러오기 실패: "+e.message)}};importLabel.append(file);foot.append(importLabel);editor.append(foot);
